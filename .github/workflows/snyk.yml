name: Snyk

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: snyk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Skip when SNYK_TOKEN is missing
        if: ${{ env.SNYK_TOKEN == '' }}
        run: echo "SNYK_TOKEN is not configured. Skipping dependency scan."
      - uses: snyk/actions/node@0.4.0
        if: ${{ env.SNYK_TOKEN != '' }}
        with:
          args: --all-projects --detection-depth=2
