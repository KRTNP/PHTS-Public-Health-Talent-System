name: Deploy Windows Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_id:
        description: "Release identifier (optional)"
        required: false
        type: string
      ref:
        description: "Git ref to deploy (branch/tag/sha)"
        required: false
        default: "main"
        type: string
      base_dir:
        description: "Windows base directory on target host (optional)"
        required: false
        default: ""
        type: string
      node_path:
        description: "Node executable path on target host (optional)"
        required: false
        default: ""
        type: string
      backend_service:
        description: "Backend service name (optional)"
        required: false
        default: ""
        type: string
      frontend_service:
        description: "Frontend service name (optional)"
        required: false
        default: ""
        type: string
      backend_port:
        description: "Backend service port (optional)"
        required: false
        default: ""
        type: string
      frontend_port:
        description: "Frontend service port (optional)"
        required: false
        default: ""
        type: string
      nssm_path:
        description: "NSSM executable path on target host (optional)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-windows-production
  cancel-in-progress: false

jobs:
  build-artifact:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    outputs:
      release_id: ${{ steps.release_meta.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref_name }}

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: npm run install:all

      - name: Verify quality gates
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: rootpass
          DB_NAME: phts_test
          TEST_DB_NAME: phts_test
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          JWT_SECRET: ci-test-secret
          NODE_ENV: test
          TZ: Asia/Bangkok
        run: |
          npm run lint:all
          npm run typecheck:all
          npm run test:all

      - name: Build production artifact
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: http://127.0.0.1:4000/api
          TZ: Asia/Bangkok
        run: npm run build:all

      - id: release_meta
        name: Resolve release id
        run: |
          if [ -n "${{ inputs.release_id }}" ]; then
            RID="${{ inputs.release_id }}"
          else
            RID="rel-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          fi
          echo "release_id=$RID" >> "$GITHUB_OUTPUT"
          echo "Using release id: $RID"

      - name: Build deployable artifact
        run: |
          mkdir -p artifact/backend artifact/frontend
          cp -R backend/dist artifact/backend/dist
          cp backend/package.json backend/package-lock.json artifact/backend/
          cp -R frontend/.next artifact/frontend/.next
          cp -R frontend/public artifact/frontend/public
          cp frontend/package.json frontend/package-lock.json artifact/frontend/

      - name: Archive artifact
        run: |
          cd artifact
          zip -r "../phts-${{ steps.release_meta.outputs.release_id }}.zip" backend frontend

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: phts-release
          path: phts-${{ steps.release_meta.outputs.release_id }}.zip
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: build-artifact
    runs-on: [self-hosted, windows, x64]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: phts-release
          path: .

      - name: Deploy release
        shell: powershell
        run: |
          $artifact = "phts-${{ needs.build-artifact.outputs.release_id }}.zip"
          $baseDir = "${{ inputs.base_dir }}"
          if (-not $baseDir) {
            $baseDir = "${{ vars.WINDOWS_BASE_DIR }}"
          }
          if (-not $baseDir) {
            $baseDir = "D:\apps\phts"
          }
          $nodePath = "${{ inputs.node_path }}"
          if (-not $nodePath) {
            $nodePath = "${{ vars.WINDOWS_NODE_PATH }}"
          }
          if (-not $nodePath) {
            $nodePath = Join-Path $baseDir "runtime\node20\node.exe"
          }
          $backendService = "${{ inputs.backend_service }}"
          if (-not $backendService) {
            $backendService = "${{ vars.WINDOWS_BACKEND_SERVICE }}"
          }
          if (-not $backendService) {
            $backendService = "PHTS-Backend"
          }
          $frontendService = "${{ inputs.frontend_service }}"
          if (-not $frontendService) {
            $frontendService = "${{ vars.WINDOWS_FRONTEND_SERVICE }}"
          }
          if (-not $frontendService) {
            $frontendService = "PHTS-Frontend"
          }
          $backendPort = "${{ inputs.backend_port }}"
          if (-not $backendPort) {
            $backendPort = "${{ vars.WINDOWS_BACKEND_PORT }}"
          }
          if (-not $backendPort) {
            $backendPort = "4000"
          }
          $frontendPort = "${{ inputs.frontend_port }}"
          if (-not $frontendPort) {
            $frontendPort = "${{ vars.WINDOWS_FRONTEND_PORT }}"
          }
          if (-not $frontendPort) {
            $frontendPort = "3000"
          }
          $nssmPath = "${{ inputs.nssm_path }}"
          if (-not $nssmPath) {
            $nssmPath = "${{ vars.WINDOWS_NSSM_PATH }}"
          }
          if (-not $nssmPath) {
            $nssmPath = Join-Path $baseDir "tools\nssm\win64\nssm.exe"
          }
          $healthUrl = "http://127.0.0.1:$backendPort/health"
          Write-Host "Using BaseDir: $baseDir"
          Write-Host "Using NodePath: $nodePath"
          Write-Host "Using BackendService: $backendService"
          Write-Host "Using FrontendService: $frontendService"
          Write-Host "Using BackendPort: $backendPort"
          Write-Host "Using FrontendPort: $frontendPort"
          Write-Host "Using NssmPath: $nssmPath"
          Write-Host "Using HealthUrl: $healthUrl"
          .\scripts\windows\register-services.ps1 `
            -BaseDir $baseDir `
            -NodePath $nodePath `
            -NssmPath $nssmPath `
            -BackendService $backendService `
            -FrontendService $frontendService `
            -BackendPort ([int]$backendPort) `
            -FrontendPort ([int]$frontendPort)
          .\scripts\windows\deploy.ps1 `
            -ReleaseId "${{ needs.build-artifact.outputs.release_id }}" `
            -ArtifactPath $artifact `
            -BaseDir $baseDir `
            -NodePath $nodePath `
            -BackendService $backendService `
            -FrontendService $frontendService `
            -HealthUrl $healthUrl
